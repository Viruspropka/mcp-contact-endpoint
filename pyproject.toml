[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contact-endpoint"
version = "0.1.0"
description = "An agent-facing contact endpoint: an MCP tool and a classic HTTP form, with validation, rate limits and spam handling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Berezka" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contact-endpoint = "contact_endpoint.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # starlette 1.x nudges TestClient users towards httpx2; harmless here.
    "ignore:Using .httpx. with .starlette.testclient.",
]
